name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.22.0]
    env:
      CPV_CONFLUENCE_API_TOKEN: ${{ secrets.CPV_CONFLUENCE_API_TOKEN }}
      CPV_CONFLUENCE_API_USERNAME: ${{ secrets.CPV_CONFLUENCE_API_USERNAME }}
      CPV_CONFLUENCE_BASE_URL: ${{ secrets.CPV_CONFLUENCE_BASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      CPV_JIRA_READER_API_USERNAME: ${{ secrets.CPV_JIRA_READER_API_USERNAME }}
      CPV_JIRA_READER_API_TOKEN: ${{ secrets.CPV_JIRA_READER_API_TOKEN }}
      CPV_XRAY_BASE_URL: ${{ secrets.CPV_XRAY_BASE_URL }}
      CPV_XRAY_CLIENT_ID: ${{ secrets.CPV_XRAY_CLIENT_ID }}
      CPV_XRAY_CLIENT_SECRET: ${{ secrets.CPV_XRAY_CLIENT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Prod build
        run: npm run build

      - name: Install Vercel CLI
        if: ${{ matrix.node-version == '22.22.0' }}
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        if: ${{ matrix.node-version == '22.22.0' }}
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        if: ${{ matrix.node-version == '22.22.0' }}
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: vercel-deploy
        if: ${{ matrix.node-version == '22.22.0' }}
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        # run: |
        #   PREVIEW_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
        #   echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_OUTPUT
        #   echo "DEPLOYMENT_CREATED=true" >> $GITHUB_OUTPUT

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v2
        if: ${{ steps.vercel-deploy.outputs.DEPLOYMENT_CREATED }}
        with:
          browser: chrome
          config-file: cypress.config.js
        env:
          CYPRESS_BASE_URL: ${{ steps.vercel-deploy.outputs.PREVIEW_URL }}/cpv

      - name: Upload Cypress Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-artifacts
          retention-days: 5
          path: ${{ github.repository }}/tests/e2e/cypress/cypress-image-diff-screenshots/

      - name: Upload Cypress Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos-artifacts
          retention-days: 1
          path: ${{ github.repository }}/tests/e2e/cypress/videos/

  # `main` requires a PR + passing status checks (see #694), so semantic-release
  # can no longer push its version-bump commit straight to `main` (only a repo
  # admin's token could bypass that, which we deliberately avoided). Instead,
  # this is split into two jobs that both go through a normal PR:
  #   1. prepare-release computes the next version/changelog and opens (or
  #      updates) a "chore(release): x.y.z" PR carrying just that bump, same as
  #      any other PR — it still needs a human to review and merge it.
  #   2. publish-release runs when that PR merges (its commit message contains
  #      "chore(release):") and tags + publishes the GitHub Release. Pushing a
  #      *tag* isn't restricted by the branch protection on `main` (that only
  #      covers `refs/heads/main`), so no bypass is needed there either.
  prepare-release:
    name: Prepare Release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "22.22.0"

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22.22.0-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.22.0-npm-

      - name: Install dependencies
        run: npm ci

      - name: Install semantic-release
        run: npm install -g semantic-release@19.0.5 @semantic-release/changelog@6.0.1

      - name: Compute next version and changelog (no push, no tag, no GitHub release)
        # semantic-release's own config-merging always lets a local .releaserc
        # win over --extends for the `plugins` array (verified locally), so
        # `-e ./.releaserc.prepare.json` would silently be ignored while a
        # root .releaserc exists — swapping the file's content instead is the
        # only way to actually drop the git/github plugins for this run.
        # Restored below before any git operations, so it never leaks into
        # the release commit or the working tree.
        run: |
          cp .releaserc /tmp/releaserc.full.json
          cp .releaserc.prepare.json .releaserc
          npx semantic-release
          cp /tmp/releaserc.full.json .releaserc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether a version bump was produced
        id: check
        run: |
          if git diff --quiet -- package.json CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the release PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B release/next
          git add package.json CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          git push --force origin release/next

          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          # Ticket
          N/A — automated release PR generated by semantic-release from commits already merged to \`main\`.

          # Problem
          N/A — no problem being fixed; this bundles the pending version bump and changelog for release \`${VERSION}\`.

          # Root Cause Analysis
          N/A — not applicable to an automated release PR.

          # Solution
          Bumps \`package.json\` to \`${VERSION}\` and updates \`CHANGELOG.md\` with the notes generated from commits since the last release. Merging this PR (any merge strategy is fine) triggers the \`publish-release\` job, which tags whatever commit ends up at the tip of \`main\` as \`v${VERSION}\` and publishes the GitHub Release.

          # Proof
          See the \`CHANGELOG.md\` diff in this PR for the generated release notes.

          | Before | After |
          |--------|-------|
          | \`main\` at the previous released version | \`main\` at \`${VERSION}\`, tagged and released on merge |

          # Tasks
          - [x] Clean code principles are respected — N/A, generated files only
          - [x] Logging is added — N/A
          - [x] Error handling is added, to the right place, without hiding errors — N/A
          - [ ] Documentation is updated — N/A
          - [ ] List breaking changes (if applicable) — see CHANGELOG.md
          - [ ] Detailed information about new dependencies (if applicable) — N/A
          - [ ] Dependencies consistently updated (e.g. \`package-lock.json\`) — N/A
          - [x] All newly developed functionality is tested — N/A, no new functionality
          - [x] Unit tests check for both positive and negative cases — N/A
          - [ ] Unit tests that became obsolete have been removed — N/A
          - [ ] Referencing Pull Requests that need to be merged before/after — N/A

          # Documentation
          N/A

          # Project specific tasks
          N/A — section not applicable, removed per template instructions.
          EOF

          EXISTING_PR=$(gh pr list --head release/next --base main --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "chore(release): ${VERSION}" --body-file "$BODY_FILE"
          else
            gh pr create --base main --head release/next --title "chore(release): ${VERSION}" --body-file "$BODY_FILE"
          fi

  publish-release:
    name: Publish Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          # actions/checkout passes --no-tags by default; without this, the
          # "does this tag already exist" safety check below would never find
          # a match even when the tag was already pushed by a prior run.
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "22.22.0"

      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping (already published)."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

          # Extract this version's section from CHANGELOG.md, i.e. everything
          # between its own heading and the next version heading. Minor/major
          # releases get a single "#", patches get "##" (semantic-release's
          # own convention), so match both.
          awk "/^#{1,2} \[?${VERSION}/{flag=1; next} /^#{1,2} \[?[0-9]/{if (flag) exit} flag" CHANGELOG.md > /tmp/release-notes.md

          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
